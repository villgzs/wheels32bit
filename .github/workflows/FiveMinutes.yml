name: FiveMinutes

on:
  schedule:
    # 5 percenként fut le
    - cron: '2/5 * * * *'
  # Lehetővé teszi a manuális indítást is a GitHub felületéről
  workflow_dispatch:

jobs:
  print-time:
    runs-on: ubuntu-latest
    steps:
      - name: Aktuális idő kiírása
        run: |
          CURRENT_TIME=$(date)
          echo "Aktuális UTC idő: $CURRENT_TIME"
          echo "### Futás Összegzés" >> $GITHUB_STEP_SUMMARY
          echo "- **Aktuális UTC idő:** $CURRENT_TIME" >> $GITHUB_STEP_SUMMARY
