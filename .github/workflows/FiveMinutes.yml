name: FiveMinutes

on:
  schedule:
    - cron: '19/30 * * * *'
      timezone: 'Europe/Budapest'
  
  workflow_dispatch:

jobs:
  print-time:
    runs-on: ubuntu-latest
    steps:
      - name: Aktuális idő kiírása
        run: |
          CURRENT_TIME=$(curl -s https://worldtimeapi.org/api/timezone/Etc/UTC | sed -n 's/.*"datetime":"\([^"]*\)".*/\1/p')
          
          if [ -z "$CURRENT_TIME" ]; then
            echo "Nem sikerült lekérni az időt a webes szolgáltatásból"
            exit 1
          fi
      
          echo "Aktuális UTC idő: $CURRENT_TIME"
          echo "### Futás Összegzés" >> $GITHUB_STEP_SUMMARY
          echo "- **Aktuális UTC idő:** $CURRENT_TIME" >> $GITHUB_STEP_SUMMARY
