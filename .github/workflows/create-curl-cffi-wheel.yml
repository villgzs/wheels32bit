name: Build curl_cffi wheel for ARMv7

on:
  workflow_dispatch:
    inputs:
      reqversion:
        description: 'curl-cffi version:'
        required: false
        default: "0.17.0"  

jobs:
  prepare:
    name: Prepare source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ha.outputs.version }}      
    steps:
      - name: Info about version
        id: ha
        
        run: |
          VERSION=${{ inputs.reqversion }}
          
          echo "curl-cffi version: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}"   >> $GITHUB_STEP_SUMMARY
          
  build-armv7:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Create output directories
        run: mkdir -p dist wheelhouse
        
      - name: Build curl_cffi inside ARMv7 container
        shell: bash
        run: |
          set -e
      
          mkdir -p "${{ github.workspace }}/dist"
          mkdir -p "${{ github.workspace }}/wheelhouse"
      
          cat > bash.txt <<'BASH_SCRIPT'
          #!/bin/bash
          set -e
      
          echo "=== Installing dependencies ==="
      
          apk add --no-cache \
            build-base \
            libffi-dev \
            openssl-dev \
            yaml-dev \
            nasm \
            zlib-ng-dev \
            zlib-dev \
            jpeg-dev \
            freetype-dev \
            lcms2-dev \
            openjpeg-dev \
            tiff-dev \
            re2-dev \
            bluez-dev \
            glib-dev \
            eudev-dev \
            libxml2-dev \
            libxslt-dev \
            libpng-dev \
            libjpeg-turbo-dev \
            gmp-dev \
            mpfr-dev \
            mpc1-dev \
            ffmpeg-dev \
            openblas-dev \
            fftw-dev \
            lapack-dev \
            gfortran \
            blas-dev \
            eigen-dev \
            glew-dev \
            harfbuzz-dev \
            hdf5-dev \
            libtbb-dev \
            mesa-dev \
            openexr-dev \
            uchardet-dev \
            libtool \
            automake \
            autoconf \
            git \
            py3-pip
      
          echo "=== Checking architecture ==="
          uname -m
          python3 -c 'import platform; print(platform.uname())'
      
          echo "=== Cloning curl_cffi ==="
          git clone --depth 1 \
            --branch "v${{ needs.prepare.outputs.version }}" \
            https://github.com/lexiforest/curl_cffi.git
      
          cd curl_cffi
      
          echo "=== Patching build.py ==="
          python3 - <<'PY'
          from pathlib import Path
      
          p = Path("scripts/build.py")
          s = p.read_text()
      
          old = 'libc = glibc_flavor if libc == "glibc" else "musl"'
          new = 'libc = "gnueabihf" if uname.machine in ("armv7l", "armv6l") else (glibc_flavor if libc == "glibc" else "musl")'
      
          if old not in s:
              raise SystemExit("ERROR: Original line not found in scripts/build.py")
      
          p.write_text(s.replace(old, new, 1))
          print("Patch applied successfully.")
          PY
      
          echo "=== Building wheel ==="
          make preprocess
          python3 -m pip wheel . --no-deps -w /dist/
      
          echo "=== Repairing wheel with auditwheel ==="
          auditwheel repair /dist/curl_cffi-*.whl -w /wheelhouse/
          BASH_SCRIPT
      
          echo "=== Running ARMv7 container ==="
      
          docker run --rm \
            --platform linux/arm/v7 \
            -v "${{ github.workspace }}/bash.txt:/bash.txt:ro" \
            -v "${{ github.workspace }}/dist:/dist" \
            -v "${{ github.workspace }}/wheelhouse:/wheelhouse" \
            ghcr.io/villgzs/hass-core32-basepython:2026.06.1 \
            /bin/bash /bash.txt
            
      - name: Upload Built Wheels
        uses: actions/upload-artifact@v4
        with:
          name: curl-cffi-${{ needs.prepare.outputs.version }}-armv7-wheels
          path: wheelhouse/*.whl
